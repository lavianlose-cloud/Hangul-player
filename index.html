<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Xemi</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    #video-container { width: 100%; height: 100%; }
    #video-container > div { width: 100% !important; height: 100% !important; }

    #ime-input {
      position: fixed;
      left: -9999px;
      top: 0;
      width: 1px;
      height: 1px;
      opacity: 0;
      border: none;
      outline: none;
      background: transparent;
      color: transparent;
      caret-color: transparent;
      font-size: 16px;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <div id="video-container"></div>
  <textarea id="ime-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>

  <script type="module">
    import { ArcwareInit } from 'https://unpkg.com/@arcware-cloud/pixelstreaming-websdk@1.4.11/index.mjs';

    const { Config, PixelStreaming, Application } = ArcwareInit(
      { shareId: 'share-f7b5124c-4b49-4a28-a24f-75f83bf12de4' },
      {
        initialSettings: {
          AutoPlayVideo: true,
          AutoConnect: true,
          StartVideoMuted: false,
          HoveringMouse: false,
          UseMic: true,
        }
      }
    );

    document.getElementById('video-container').appendChild(Application.rootElement);

    function getHandlers() {
      return PixelStreaming?._webRtcController?.streamMessageController?.toStreamerHandlers;
    }
    function psKeyDown(keyCode, isRepeat) {
      const h = getHandlers();
      if (h?.has('KeyDown')) { h.get('KeyDown')([keyCode, isRepeat ? 1 : 0]); return; }
      const t = psTarget();
      if (t) t.dispatchEvent(new KeyboardEvent('keydown', { bubbles: true, cancelable: true, keyCode, which: keyCode }));
    }
    function psKeyUp(keyCode) {
      const h = getHandlers();
      if (h?.has('KeyUp')) { h.get('KeyUp')([keyCode]); return; }
      const t = psTarget();
      if (t) t.dispatchEvent(new KeyboardEvent('keyup', { bubbles: true, cancelable: true, keyCode, which: keyCode }));
    }
    function psKeyPress(charCode) {
      const h = getHandlers();
      if (h?.has('KeyPress')) { h.get('KeyPress')([charCode]); return; }
      const t = psTarget();
      if (t) t.dispatchEvent(new KeyboardEvent('keypress', { bubbles: true, cancelable: true, charCode, which: charCode }));
    }
    function psTarget() {
      return Application.rootElement.querySelector('video')
          || Application.rootElement.querySelector('canvas')
          || Application.rootElement;
    }

    // ── Korean IME ────────────────────────────────────────────────────────────
    const imeInput = document.getElementById('ime-input');
    let isComposing = false;
    let pendingKeydown = null;

    imeInput.addEventListener('compositionstart', () => { isComposing = true; });
    imeInput.addEventListener('compositionupdate', () => { isComposing = true; });

    imeInput.addEventListener('compositionend', (e) => {
      isComposing = false;
      for (const ch of (e.data || '')) psKeyPress(ch.codePointAt(0));
      imeInput.value = '';
      if (pendingKeydown) {
        const kc = pendingKeydown.keyCode;
        pendingKeydown = null;
        psKeyDown(kc, false);
        if (kc === 13 || kc === 32) psKeyPress(kc);
      }
    });

    // ── Document-level keyboard capture ──────────────────────────────────────
    let gameActive = false;
    document.addEventListener('click', () => {
      gameActive = true;
      setTimeout(() => imeInput.focus(), 0);
    });
    window.addEventListener('blur',  () => { gameActive = false; });
    window.addEventListener('focus', () => { gameActive = true;  });
    window.addEventListener('load',  () => { gameActive = true; imeInput.focus(); });

    document.addEventListener('keydown', (e) => {
      if (!gameActive) return;
      if (e.keyCode === 229) return;
      if (isComposing) {
        if (e.key === 'Enter' || e.key === ' ') pendingKeydown = e;
        return;
      }
      psKeyDown(e.keyCode, e.repeat);
    }, true);

    document.addEventListener('keyup', (e) => {
      if (!gameActive) return;
      if (e.keyCode === 229) return;
      if (isComposing) return;
      psKeyUp(e.keyCode);
    }, true);

    document.addEventListener('keypress', (e) => {
      if (!gameActive) return;
      if (isComposing) return;
      const cc = e.charCode || e.which;
      if (cc > 0) psKeyPress(cc);
    }, true);

  </script>
</body>
</html>
