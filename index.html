<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Xemi</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    #video-container { width: 100%; height: 100%; }
    #video-container > div { width: 100% !important; height: 100% !important; }

    #ime-input {
      position: fixed;
      left: -9999px;
      top: 0;
      width: 1px;
      height: 1px;
      opacity: 0;
      border: none;
      outline: none;
      background: transparent;
      color: transparent;
      caret-color: transparent;
      font-size: 16px;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <div id="video-container"></div>
  <textarea id="ime-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>

  <script type="module">
    import { ArcwareInit } from 'https://unpkg.com/@arcware-cloud/pixelstreaming-websdk@1.4.11/index.mjs';

    const { Config, PixelStreaming, Application } = ArcwareInit(
      { shareId: 'share-f7b5124c-4b49-4a28-a24f-75f83bf12de4' },
      {
        initialSettings: {
          AutoPlayVideo: true,
          AutoConnect: true,
          StartVideoMuted: false,
          HoveringMouse: false,
          UseMic: true,
        }
      }
    );

    document.getElementById('video-container').appendChild(Application.rootElement);

    // ── Korean IME fix ────────────────────────────────────────────────────────

    const imeInput = document.getElementById('ime-input');
    let isComposing = false;
    let pendingKeydownEvent = null; // Enter/Space pressed during composition — deferred

    function getTarget() {
      return Application.rootElement.querySelector('video')
          || Application.rootElement.querySelector('canvas')
          || Application.rootElement;
    }

    function forwardKeyEvent(type, e) {
      try {
        getTarget().dispatchEvent(new KeyboardEvent(type, {
          bubbles: true, cancelable: true,
          key: e.key, code: e.code, keyCode: e.keyCode,
          shiftKey: e.shiftKey, ctrlKey: e.ctrlKey, altKey: e.altKey
        }));
      } catch (_) {}
    }

    function sendKeyPress(charCode) {
      try {
        const toStreamer =
          PixelStreaming?._webRtcController?.streamMessageController?.toStreamerHandlers;
        if (toStreamer?.has('KeyPress')) {
          toStreamer.get('KeyPress')([charCode]);
          return;
        }
      } catch (_) {}
      try {
        getTarget().dispatchEvent(new KeyboardEvent('keypress', {
          bubbles: true, cancelable: true, charCode, keyCode: charCode, which: charCode
        }));
      } catch (_) {}
    }

    imeInput.addEventListener('compositionstart', () => { isComposing = true; });
    imeInput.addEventListener('compositionupdate', () => { isComposing = true; });

    imeInput.addEventListener('compositionend', (e) => {
      isComposing = false;
      const text = e.data || '';
      for (const ch of text) {
        sendKeyPress(ch.codePointAt(0));
      }
      imeInput.value = '';

      // Flush Enter/Space that was pressed to end this composition
      if (pendingKeydownEvent) {
        const pending = pendingKeydownEvent;
        pendingKeydownEvent = null;
        forwardKeyEvent('keydown', pending);
      }
    });

    imeInput.addEventListener('keydown', (e) => {
      if (isComposing) {
        // Enter / Space end composition — defer keydown until compositionend fires
        if (e.key === 'Enter' || e.key === ' ') {
          pendingKeydownEvent = e;
        }
        return;
      }
      forwardKeyEvent('keydown', e);
    });

    imeInput.addEventListener('keyup', (e) => {
      // By keyup, compositionend has already fired (isComposing is false)
      forwardKeyEvent('keyup', e);
    });

    document.addEventListener('click', () => imeInput.focus(), true);
    document.addEventListener('touchstart', () => imeInput.focus(), true);
    Application.rootElement.addEventListener('click', () => imeInput.focus(), true);
    window.addEventListener('load', () => imeInput.focus());
  </script>
</body>
</html>
