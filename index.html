<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Xemi</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    #video-container { width: 100%; height: 100%; }
    #video-container > div { width: 100% !important; height: 100% !important; }

    #ime-input {
      position: fixed;
      left: -9999px;
      top: 0;
      width: 1px;
      height: 1px;
      opacity: 0;
      border: none;
      outline: none;
      background: transparent;
      color: transparent;
      caret-color: transparent;
      font-size: 16px;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <div id="video-container"></div>
  <textarea id="ime-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>

  <script type="module">
    import { ArcwareInit } from 'https://unpkg.com/@arcware-cloud/pixelstreaming-websdk@1.4.11/index.mjs';

    const { Config, PixelStreaming, Application } = ArcwareInit(
      { shareId: 'share-f7b5124c-4b49-4a28-a24f-75f83bf12de4' },
      {
        initialSettings: {
          AutoPlayVideo: true,
          AutoConnect: true,
          StartVideoMuted: false,
          HoveringMouse: false,
          UseMic: true,
        }
      }
    );

    document.getElementById('video-container').appendChild(Application.rootElement);

    // ── Debug: PS 객체 구조 확인 ─────────────────────────────────────────────
    setTimeout(() => {
      console.log('[DEBUG] PixelStreaming keys:', Object.keys(PixelStreaming || {}));
      console.log('[DEBUG] _webRtcController:', PixelStreaming?._webRtcController);
      const h = PixelStreaming?._webRtcController?.streamMessageController?.toStreamerHandlers;
      console.log('[DEBUG] toStreamerHandlers:', h);
      if (h) console.log('[DEBUG] handler keys:', [...h.keys()]);
    }, 3000); // 3초 후 WebRTC 연결 완료 예상

    function getHandlers() {
      return PixelStreaming?._webRtcController?.streamMessageController?.toStreamerHandlers;
    }

    function psKeyDown(keyCode, isRepeat) {
      const h = getHandlers();
      console.log('[KEY] KeyDown', keyCode, '| handlers:', !!h, '| hasKeyDown:', h?.has('KeyDown'));
      if (h?.has('KeyDown')) {
        h.get('KeyDown')([keyCode, isRepeat ? 1 : 0]);
        console.log('[KEY] KeyDown sent via data channel');
        return;
      }
      console.log('[KEY] KeyDown fallback → DOM dispatch');
      const t = psTarget();
      if (t) t.dispatchEvent(new KeyboardEvent('keydown', { bubbles: true, cancelable: true, keyCode, which: keyCode }));
    }

    function psKeyUp(keyCode) {
      const h = getHandlers();
      if (h?.has('KeyUp')) { h.get('KeyUp')([keyCode]); return; }
      const t = psTarget();
      if (t) t.dispatchEvent(new KeyboardEvent('keyup', { bubbles: true, cancelable: true, keyCode, which: keyCode }));
    }

    function psKeyPress(charCode) {
      const h = getHandlers();
      if (h?.has('KeyPress')) { h.get('KeyPress')([charCode]); return; }
      const t = psTarget();
      if (t) t.dispatchEvent(new KeyboardEvent('keypress', { bubbles: true, cancelable: true, charCode, which: charCode }));
    }

    function psTarget() {
      return Application.rootElement.querySelector('video')
          || Application.rootElement.querySelector('canvas')
          || Application.rootElement;
    }

    // ── Korean IME fix ────────────────────────────────────────────────────────

    const imeInput = document.getElementById('ime-input');
    let isComposing = false;
    let pendingKeydown = null;

    imeInput.addEventListener('compositionstart', () => { isComposing = true; });
    imeInput.addEventListener('compositionupdate', () => { isComposing = true; });

    imeInput.addEventListener('compositionend', (e) => {
      isComposing = false;
      for (const ch of (e.data || '')) {
        psKeyPress(ch.codePointAt(0));
      }
      imeInput.value = '';
      if (pendingKeydown) {
        const kc = pendingKeydown.keyCode;
        pendingKeydown = null;
        psKeyDown(kc, false);
        if (kc === 13 || kc === 32) psKeyPress(kc);
      }
    });

    imeInput.addEventListener('keydown', (e) => {
      if (isComposing) {
        if (e.key === 'Enter' || e.key === ' ') pendingKeydown = e;
        return;
      }
      psKeyDown(e.keyCode, e.repeat);
    });

    imeInput.addEventListener('keypress', (e) => {
      if (isComposing) return;
      const cc = e.charCode || e.which;
      if (cc > 0) psKeyPress(cc);
    });

    imeInput.addEventListener('keyup', (e) => {
      if (isComposing) return;
      psKeyUp(e.keyCode);
    });

    document.addEventListener('click', () => imeInput.focus(), true);
    document.addEventListener('touchstart', () => imeInput.focus(), true);
    Application.rootElement.addEventListener('click', () => imeInput.focus(), true);
    window.addEventListener('load', () => imeInput.focus());
  </script>
</body>
</html>
